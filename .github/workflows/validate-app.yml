name: Validate Palwerk
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'ui-*.css'
      - 'data/**'
      - 'scripts/validate-app.mjs'
      - '.github/workflows/validate-app.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-app.mjs