name: Sync Pal details
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'
  push:
    paths:
      - 'scripts/sync-pal-details.mjs'
      - '.github/workflows/sync-pal-details.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-pal-details.mjs
      - name: Commit synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pal-details-local.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync Pal metadata"
          git pull --rebase origin main
          git push