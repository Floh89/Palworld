name: Sync Pal data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-pal-data.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Palworld 1.0 catalog
        run: |
          mkdir -p data
          curl -fsSL https://raw.githubusercontent.com/beliarance/palworld-kb/main/data/pals_combat.json -o data/pals-combat-local.json
          test "$(python -c "import json; print(len(json.load(open('data/pals-combat-local.json'))))")" -gt 200
      - name: Commit local catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pals-combat-local.json
          git diff --cached --quiet || git commit -m "Sync local Palworld 1.0 catalog"
          git push
