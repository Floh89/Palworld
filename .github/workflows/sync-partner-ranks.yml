name: Sync partner rank data
on:
  push:
    paths:
      - 'scripts/sync-partner-ranks.mjs'
      - '.github/workflows/sync-partner-ranks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-partner-ranks.mjs
      - name: Commit synced data
        run: |
          if git diff --quiet -- data/partner-ranks-local.json && git ls-files --error-unmatch data/partner-ranks-local.json >/dev/null 2>&1; then
            echo 'No data changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/partner-ranks-local.json
          git commit -m 'Sync exact partner skill rank tables'
          git push
